services:
  dotasks:
    build:
      context: .
    restart: unless-stopped
    environment:
      DOTASKS_MODE: cloud
      DOTASKS_HOST: 0.0.0.0
      DOTASKS_PORT: 8765
      DOTASKS_HOME: /data/dotasks
      DOTASKS_PUBLIC_URL: ${DOTASKS_PUBLIC_URL:?set DOTASKS_PUBLIC_URL}
      DOTASKS_HTTP_USER: ${DOTASKS_HTTP_USER:?set DOTASKS_HTTP_USER}
      DOTASKS_HTTP_PASSWORD: ${DOTASKS_HTTP_PASSWORD:?set DOTASKS_HTTP_PASSWORD}
      DOTASKS_AGENT_ID: ${DOTASKS_AGENT_ID:-default}
      DOTASKS_AGENT_TOKEN: ${DOTASKS_AGENT_TOKEN:?set DOTASKS_AGENT_TOKEN}
    ports:
      - "${DOTASKS_BIND_ADDRESS:-127.0.0.1}:${DOTASKS_BIND_PORT:-8765}:8765"
    volumes:
      - dotasks-data:/data/dotasks

volumes:
  dotasks-data:
