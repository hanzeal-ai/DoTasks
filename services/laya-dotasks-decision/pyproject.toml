[project]
name = "laya-dotasks-decision"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "laya==0.3.20",
  "torch>=2.0.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
