name: Test, publish, and deploy DoTasks Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy through the restricted SSH receiver
        type: boolean
        default: false

concurrency:
  group: dotasks-cloud-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - run: npm --prefix web ci
      - run: ./scripts/build-portable-cli
      - name: Verify relocated native CLI and MCP
        run: uv run --no-project --python 3.14 python scripts/verify-portable-cli.py "dist/DoTasksCLI-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-${{ matrix.platform }}
          path: dist/cli/
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  build:
    needs: portable
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Install shell used by local Agent integration tests
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run tests
        run: ./scripts/test

      - name: Build source CLI and verify pinned Brew formula
        run: |
          npm --prefix web ci
          ./scripts/build-cli
          python3 scripts/generate-brew-formula.py --check
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: portable-macos-*
          path: portable-cli
          merge-multiple: true
      - name: Verify both native distributions
        run: python3 scripts/verify-cli-assets.py portable-cli --portable-only

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build deployment image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/dotasks-cloud.tar
          tags: dotasks-cloud:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package verified image
        run: python3 deployment/package.py "$GITHUB_SHA" "$RUNNER_TEMP/dotasks-release.zip" "cloud=$RUNNER_TEMP/dotasks-cloud.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotasks-release-${{ github.sha }}
          path: ${{ runner.temp }}/dotasks-release.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dotasks-release-${{ github.sha }}
          path: ${{ runner.temp }}/dotasks-release
      - name: Deploy through restricted SSH receiver
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deployment/send.sh site "$GITHUB_SHA" "$RUNNER_TEMP/dotasks-release/dotasks-release.zip"

  cleanup-artifacts:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Delete consumed transfer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == ("dotasks-release-" + env.GITHUB_SHA) or .name == "portable-macos-arm64" or .name == "portable-macos-x86_64") | .id')
          while IFS= read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done <<< "$artifact_ids"
